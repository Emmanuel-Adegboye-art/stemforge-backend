name: Back-end Startup Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PORT: 5000
  GROQ_API_KEY: dummy-key-for-boot-check

jobs:
  startup:
    name: Server Boots & Responds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Boot server and smoke-test root endpoint
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$PORT/" || true)
            [ "$STATUS" = "200" ] && break
            sleep 1
          done
          if [ "$STATUS" != "200" ]; then
            echo "::error::Server did not respond with 200 (got '$STATUS')"
            cat server.log
            exit 1
          fi
          echo "Root endpoint OK"

      - name: Route reachability check
        run: npm run check:routes
