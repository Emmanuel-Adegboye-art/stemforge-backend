name: Back-end Startup Check

# Trigger on every push to main and on every PR targeting main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  startup:
    name: Server Boots & Responds
    runs-on: ubuntu-latest

    steps:
      # 1️⃣  Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣  Set up Node.js
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      # 3️⃣  Install dependencies
      - name: Install dependencies
        run: npm ci || npm install

      # 4️⃣  Start the server in the background
      - name: Start Express server
        run: |
          # Set a default port if none is provided
          export PORT=${PORT:-5000}
          echo "Starting server on port $PORT..."
          # Run the server in the background; redirect logs to a file
          node server.js > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          # Give it a few seconds to boot
          sleep 5

      # 5️⃣  Smoke‑test: make sure the root endpoint returns 200
      - name: Smoke‑test root endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${PORT:-5000}/)
          echo "Root endpoint responded with $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Server did not respond with 200"
            echo "--- server.log ---"
            cat server.log
            exit 1
          fi

      # 6️⃣  Optional route check (only available after the next PR merges)
      - name: Run route check (if defined)
        run: |
          if npm run | grep -q "check:routes"; then
            echo "Running npm run check:routes..."
            npm run check:routes
          else
            echo "⚠️  'check:routes' script not defined in package.json – skipping."
          fi
        continue-on-error: false
